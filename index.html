const retArr=s=>{const r=[];for(let i=1;i<s.length;i++)r.push((s[i].p-s[i-1].p)/s[i-1].p);return r;};
function sharpeOf(s,rf=0.04){const r=retArr(s);if(r.length<30)return null;const m=r.reduce((a,b)=>a+b,0)/r.length;const sd=Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1))*Math.sqrt(252);return sd?+(((m*252-rf)/sd)).toFixed(2):null;}

const na=fa[0].p,nb=fb[0].p;const all=[...fa.map(q=>q.p/na),...fb.map(q=>q.p/nb)];const mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1;
const X=i=>i/(fa.length-1)*w,Y=v=>h-8-(v-mn)/rg*(h-28);
const pa=fa.map((q,i)=>`${X(i).toFixed(1)},${Y(q.p/na).toFixed(1)}`).join(" ");
const pb=fb.map((q,i)=>`${X(i).toFixed(1)},${Y(q.p/nb).toFixed(1)}`).join(" ");
const ra=(fa[fa.length-1].p/na-1)*100,rb=(fb[fb.length-1].p/nb-1)*100;
return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="background:#fff;border:1px solid var(--line);border-radius:10px">
<polyline fill="none" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="4 3" points="${pb}"/>
<polyline fill="none" stroke="#0d1f33" stroke-width="2.2" points="${pa}"/>
<text x="8" y="16" font-size="11" font-family="Inter" font-weight="700" fill="#0d1f33">${la}  ${ra>=0?"+":""}${ra.toFixed(1)}%</text>
<text x="8" y="30" font-size="11" font-family="Inter" fill="#8a94a2">${lb}  ${rb>=0?"+":""}${rb.toFixed(1)}%</text></svg>`;}

/* ═══ LLM LAYER ═══ */
const MODEL_FALLBACKS=["llama-3.3-70b-versatile","llama-3.1-8b-instant","meta-llama/llama-4-scout-17b-16e-instruct","qwen/qwen3-32b","openai/gpt-oss-20b","openai/gpt-oss-120b"];
async function llm(system,user,{model,temperature=0.7,json=false}={}){const st=state.settings;if(!st.key)return null;let useJson=json;
const chain=[model||st.deep,st.deep,...MODEL_FALLBACKS,st.fast].filter((v,i,a)=>v&&a.indexOf(v)===i);
for(const m of chain){for(let a=1;a<=2;a++){try{const body={model:m,messages:[{role:"system",content:system},{role:"user",content:user}],temperature,max_tokens:2048};if(useJson)body.response_format={type:"json_object"};
const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+st.key},body:JSON.stringify(body)});
if(r.status===429){await sleep(4000*a);continue;}
if(!r.ok){const txt=await r.text();if(/response_format|json/i.test(txt)&&useJson){useJson=false;continue;}if(/not_found|decommissioned|404|model/i.test(txt))break;continue;}
const d=await r.json();const c=(d.choices?.[0]?.message?.content||"").trim();if(c)return c;break;}catch(e){await sleep(1200);}}}
return null;}
async function listGroqModels(){if(!state.settings.key)return[];try{const r=await fetch("https://api.groq.com/openai/v1/models",{headers:{Authorization:"Bearer "+state.settings.key},signal:timeoutSignal(8000)});if(!r.ok)return[];const d=await r.json();return(d.data||[]).map(m=>m.id);}catch(e){return[];}}
async function autodetectModels(){const live=await listGroqModels();if(!live.length)return null;
const pick=(pref,rx)=>{if(pref&&pref.indexOf("gpt-oss")===-1&&live.includes(pref))return pref;for(const m of MODEL_FALLBACKS)if(live.includes(m))return m;return live.find(m=>rx&&rx.test(m))||live[0];};
const deep=pick(state.settings.deep,/70b|versatile|scout/);const fast=pick(state.settings.fast,/8b|instant/);
if(deep)state.settings.deep=deep;if(fast)state.settings.fast=fast;LS.set("saf_settings",state.settings);return{live,deep,fast};}
async function groqPing(model){try{const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+state.settings.key},body:JSON.stringify({model,messages:[{role:"user",content:"Reply with the single word: OK"}],temperature:0,max_tokens:16})});const t=await r.text();if(!r.ok)return "HTTP "+r.status+" "+t.slice(0,70);const d=JSON.parse(t);return(d.choices?.[0]?.message?.content||"").trim()||"empty content";}catch(e){return "error: "+String(e).slice(0,60);}}
const AI=()=>!!state.settings.key;
function saveAI(type,data){aiLog.push({type,date:new Date().toISOString(),data});if(aiLog.length>100)aiLog.shift();LS.set("saf_ai_log",aiLog);}

/* ═══ SIM ENGINE ═══ */
const HL=["13F filings show mega-cap managers adding to bottleneck suppliers","Congressional trading disclosure flags semiconductor equipment purchases","Sanctions enforcement tightens; freight rates on chemical tankers spike","CoWoS capacity remains sold out through next year","Helium-3 supply tightens as quantum programs scale","CDMO lead times stretch to 18 months on biotech demand","Transformer lead times exceed 100 weeks; grid buildout accelerates","Dark fleet rerouting disrupts refined product flows","Rare-earth export controls discussed; drone-motor makers scramble","Pharma glass capacity booked out; vial ecosystem at full utilization"];
function simReports(t,ind,fund,score){const rnd=rngFor("RPT:"+t);const pick=[0,1,2].map(()=>Math.floor(rnd()*HL.length));const newsScore=+(rnd()-0.4).toFixed(2);const sentScore=+(rnd()*1.1-0.5).toFixed(2);const geoScore=+(rnd()-0.2).toFixed(2);
return{technical:`Price $${ind.close.toFixed(2)} | SMA20/50/200 ${ind.sma20?.toFixed(2)}/${ind.sma50?.toFixed(2)}/${ind.sma200?.toFixed(2)}\nRSI14 ${ind.rsi?.toFixed(1)} — ${ind.rsi>70?"overbought":ind.rsi>55?"constructive momentum":ind.rsi>40?"neutral":"oversold"}\nMACD hist ${ind.hist>=0?"+":""}${ind.hist?.toFixed(2)}; ATR ${ind.atr?.toFixed(2)}\nKey Points Summary:\n• ${ind.close>ind.sma50?"Above":"Below"} 50-DMA, ${ind.close>ind.sma200?"above":"below"} 200-DMA\n• 5d ${ind.r5?.toFixed(1)}% / 20d ${ind.r20?.toFixed(1)}%\n• Ann. vol ${(ind.annVol*100).toFixed(0)}%`,
news:`Impact score: ${newsScore>=0?"+":""}${newsScore}\n• ${HL[pick[0]]}\n• ${HL[pick[1]]}\n• ${HL[pick[2]]}`,
sentiment:`Score: ${sentScore>=0?"+":""}${sentScore}\nCrowd ${sentScore>0.2?"constructive":sentScore<-0.2?"fearful (contrarian interest)":"mixed"}; shadow-supply-chain chatter ${geoScore>0.4?"elevated":"quiet"}.`,
fundamentals:`Gross margin ${(fund.grossMargin*100).toFixed(1)}% / op ${(fund.operMargin*100).toFixed(1)}% | Fwd P/E ${fund.forwardPE?.toFixed(1)} | Cap ${fmtMC(fund.marketCap)}\n${fund.grossMargin>0.4?"High margins = pricing power (bottleneck signal).":fund.forwardPE<15?"Modest valuation.":"Premium valuation requires durable growth."}`,
geopolitical:`Risk-premium score: ${geoScore>=0?"+":""}${geoScore}\n${geoScore>0.3?"Disruption WORSENING → bearish broad market, BULLISH for Shadow Alpha bottleneck assets. Flag explicitly.":"Disruption contained; risk premium modest."}`,
newsScore,sentScore,geoScore};}
function simPipeline(t,ind,fund,score,rpt){const rnd=rngFor("PIP:"+t);
const bull=`Momentum confirms: YTD ${score.ytd}% with SPY corr only ${score.correlation}. Gross margin ${(fund.grossMargin*100).toFixed(0)}% = pricing power. Geopolitical premium +${rpt.geoScore} accrues to choke-point owners. Independence ${score.independence}/25 = true alpha.`;
const bear=`Valuation risk: fwd P/E ${fund.forwardPE.toFixed(1)}. MDD ${score.max_dd}% and vol ${(ind.annVol*100).toFixed(0)}% imply a rough ride. RSI ${ind.rsi?.toFixed(0)} leaves ${ind.rsi>60?"overbought correction":"momentum doubt"} open.`;
const winBull=(score.total>=50&&score.ytd>=0);
const verdict={winner:winBull?"BULL":"BEAR",confidence:+(0.55+rnd()*0.35).toFixed(2),rationale:winBull?"Trend + independence + pricing power outweigh valuation.":"Risk/reward skewed by valuation and volatility."};
const buy=winBull&&score.total>=45;
const trader={action:buy?"BUY":(!winBull&&score.ytd<-10?"SELL":"HOLD"),position_pct:buy?clamp(10,100,Math.round(score.total+rnd()*20)):0,confidence:verdict.confidence,rationale:buy?"Accumulate physical bottleneck; uncorrelated alpha.":"Wait for better entry.",stop_loss_pct:8+Math.round(rnd()*4),take_profit_pct:15+Math.round(rnd()*10)};
const riskScore=clamp(1,10,Math.round(ind.annVol*20+Math.abs(score.max_dd)*0.15));
const risk={Aggressive:"Size up — asymmetry is the point.",Neutral:"Scale in; hedge with SPY puts.",Safe:"Drawdown "+score.max_dd+"% unacceptable at full size."};
const riskAdj={adjusted_action:riskScore>=8&&trader.action==="BUY"?"HOLD":trader.action,adjusted_position_pct:Math.round(trader.position_pct*(1-riskScore/25)),risk_score:riskScore,risk_notes:"Vol-scaled trim applied."};
const final={approved:true,final_action:riskAdj.adjusted_action,final_position_pct:riskAdj.adjusted_position_pct,notes:"Approved per review. Shadow Alpha thesis "+(buy?"intact":"not confirmed")+"."};
return{verdict,bull,bear,risk,riskAdj,trader,final};}

/* ═══ PIPELINE v2 — parallel · cancellable · rounds · vol-sizing · memo ═══ */
async function runPipeline(t,onStage){PIPE_CANCEL=false;const st=state.settings;
const s=getSeriesSync(t),spy=getSeriesSync("SPY");const ind=indicators(s);const fund=synthFund(t,s);
const score=shadowAlphaScore(s,spy)||{total:0,ytd:0,correlation:.5,max_dd:0,independence:0};const rpt=simReports(t,ind,fund,score);
const alive=()=>!PIPE_CANCEL;
onStage(1,"I. ANALYST TEAM — 5 agents in parallel","running");
const live=(st.useNews!==false)?(await Promise.race([fetchNews(t),sleep(6000).then(()=>[])])||[]):[];
const hlText=live.length?live.map(h=>"• "+h.title+" ("+h.source+")").join("\n"):HL.slice(0,4).map(h=>"• "+h).join("\n");
const pm=(st.usePM!==false)?(await Promise.race([fetchPolymarket(pmQueryFor(fund.sector),4),sleep(4000).then(()=>[])])||[]):[];
const pmTxt=pm.length?"\nPREDICTION MARKET SIGNALS (Polymarket):\n"+pm.map(m=>"• "+m.q+" → YES "+(m.yes!=null?Math.round(m.yes*100)+"%":"?")).join("\n"):"";
const mem=memory.filter(m=>m.ticker===t).slice(-5);
const memTxt=mem.length?mem.map(m=>"- "+m.date+": "+m.action+" @ "+m.position_pct+"% | "+(m.notes||"").slice(0,90)).join("\n"):"No past decisions — first analysis of this ticker.";
const defs=[["technical",P.TECH,"Technical data:\n"+JSON.stringify(ind,null,1)],
["news",P.NEWS,"Recent headlines:\n"+hlText],
["sentiment",P.SENT,"Headlines to score:\n"+hlText.split("\n").slice(0,4).join("\n")+pmTxt],
["fundamentals",P.FUND,"Fundamentals:\n"+JSON.stringify(fund,null,1)],
["geopolitical",P.GEOPOL,"Sector: "+fund.sector+"\nHeadlines:\n"+hlText+pmTxt]];
const outs=await Promise.all(defs.map(async d=>(AI()?await llm(d[1],"Ticker: "+t+"\n"+d[2]):null)));
const analysts={};defs.forEach((d,i)=>analysts[d[0]]=outs[i]||rpt[d[0]]);
if(!alive())return null;
onStage(1,"I. ANALYST TEAM",Object.entries(analysts).map(([k,v])=>"— "+k.toUpperCase()+" —\n"+v).join("\n\n"));
const reportsTxt=Object.entries(analysts).map(([k,v])=>"### "+k.toUpperCase()+" ###\n"+String(v).slice(0,600)).join("\n");
const sp=simPipeline(t,ind,fund,score,rpt);
const rounds=clamp(1,3,st.rounds||1);let bull="",bear="",transcript="";
for(let r=0;r<rounds;r++){onStage(2,"II. BULL vs BEAR — round "+(r+1)+"/"+rounds,"running");
bull=(AI()?await llm(P.BULL,"Ticker: "+t+"\nANALYST REPORTS:\n"+reportsTxt+(transcript?"\nTRANSCRIPT SO FAR (counter the latest points):\n"+transcript:"")):null)||(r?bull:sp.bull);
bear=(AI()?await llm(P.BEAR,"Ticker: "+t+"\nANALYST REPORTS:\n"+reportsTxt+"\nOPPOSING CASE TO REBUT:\n"+bull):null)||(r?bear:sp.bear);
transcript+="\n— Round "+(r+1)+" —\n[BULL]\n"+bull+"\n[BEAR]\n"+bear;
if(!alive())return null;}
let verdict=(AI()?extractJSON(await llm(P.JUDGE,"FULL DEBATE TRANSCRIPT:\n"+transcript,{temperature:.2,json:true})):null);
verdict=verdict&&verdict.winner?verdict:sp.verdict;
onStage(2,"II. VERDICT: "+verdict.winner+" (confidence "+verdict.confidence+")",transcript+"\n\nJUDGE: "+(verdict.rationale||""));
onStage(3,"III. TRADER","running");
const volTxt="\nRealized vol: "+(ind.annVol*100).toFixed(0)+"% annualized. Target portfolio-vol contribution: "+(st.tv||20)+"%. Size the position accordingly.\n";
let trader=(AI()?extractJSON(await llm(P.TRADER,"Ticker: "+t+"\nANALYST REPORTS:\n"+reportsTxt+"\nDEBATE WINNER: "+verdict.winner+" ("+verdict.confidence+")\nJudge: "+(verdict.rationale||"")+volTxt+"YOUR PAST DECISIONS (reflect):\n"+memTxt+"\nReturn ONLY JSON.",{temperature:.3,json:true})):null);
trader=trader&&trader.action?trader:sp.trader;
if(trader.action==="BUY"&&ind.annVol>.05)trader.vol_sized_pct=clamp(5,100,Math.round(trader.position_pct*Math.min(1,(st.tv||20)/(ind.annVol*100))));
onStage(3,"III. TRADER",JSON.stringify(trader,null,1));
if(!alive())return null;
onStage(4,"IV. RISK MANAGEMENT TEAM — 3 analysts in parallel","running");
const risk={};
await Promise.all([["Aggressive",P.RISK_AGG],["Neutral",P.RISK_NEU],["Safe",P.RISK_SAFE]].map(async([k,sys])=>{
risk[k]=(AI()?await llm(sys,"Ticker: "+t+"\nTRADER'S PLAN:\n"+JSON.stringify(trader,null,1)):null)||sp.risk[k];}));
let riskAdj=(AI()?extractJSON(await llm(P.RISK_JUDGE,"TRADER'S PLAN:\n"+JSON.stringify(trader,null,1)+"\nRISK OPINIONS:\n"+Object.entries(risk).map(([k,v])=>"["+k+"] "+v).join("\n")+"\nReturn ONLY JSON.",{temperature:.2,json:true})):null);
riskAdj=riskAdj&&riskAdj.adjusted_action?riskAdj:sp.riskAdj;
if(!alive())return null;
onStage(4,"IV. RISK TEAM",Object.entries(risk).map(([k,v])=>"["+k+"] "+v).join("\n")+"\nADJUSTED: "+JSON.stringify(riskAdj));
onStage(5,"V. FUND MANAGER","running");
let final=(AI()?extractJSON(await llm(P.MANAGER,"TRADER PLAN:\n"+JSON.stringify(trader,null,1)+"\nRISK-ADJUSTED PLAN:\n"+JSON.stringify(riskAdj,null,1)+"\nDEBATE WINNER: "+verdict.winner+"\nReturn ONLY JSON.",{temperature:.2,json:true})):null);
final=final&&final.final_action?final:sp.final;
onStage(5,"V. FUND MANAGER VERDICT",JSON.stringify(final,null,1));
if(!alive())return null;
onStage(6,"VI. AUTO-MEMO","running");
let memo=(AI()?await llm(P.DEEP,"Ticker: "+t+"\nQUANT SCORE:\n"+JSON.stringify(score,null,1)+"\nFUNDAMENTALS:\n"+JSON.stringify(fund,null,1)+"\nPIPELINE RESULT: debate="+verdict.winner+" trader="+trader.action+" FINAL="+final.final_action+" "+final.final_position_pct+"%\nRisk notes: "+(riskAdj.risk_notes||"")+"\nWrite the final investment memo.",{temperature:.4}):null);
if(!memo){const v=score.total>=55?"BUY":score.total>=45?"WATCH":"SKIP";
memo="VERDICT: "+v+"\nTHESIS: independence "+score.independence+"/25, corr "+score.correlation+" — non-consensus physical driver.\nRISK: MDD "+score.max_dd+"%, vol "+(ind.annVol*100).toFixed(0)+"%.\nCATALYST: disruption headline flow / 13F confirmation.\nSIZING: "+final.final_position_pct+"%\nGEOPOLITICAL ANGLE: benefits from supply-chain disruption.";}
onStage(6,"VI. INVESTMENT MEMO",memo);
memory.push({date:new Date().toISOString().slice(0,16).replace("T"," "),ticker:t,action:final.final_action,position_pct:final.final_position_pct,notes:String(final.notes||"").slice(0,200)});
if(memory.length>500)memory.splice(0,memory.length-500);LS.set("saf_memory",memory);

/* ═══ TRADINGAGENTS v2 ═══ */
function renderAgents(){$("#main").innerHTML=`<div class="wrap">
<div class="card"><h1>⚛️ TradingAgents — Firm Simulation</h1><div class="sub">Analysts (parallel) → Bull/Bear debate (${state.settings.rounds||1} round${(state.settings.rounds||1)>1?"s":""}) → Trader → Risk team (parallel) → Fund Manager → Auto-Memo · ${AI()?"Groq AI live":"SIM engine"}</div>
<div class="row"><input id="tk" value="NVDA" style="width:110px"><button class="btn gold" id="go">▶ Run Pipeline</button><button class="btn ghost" id="cx" hidden>⏹ Stop</button></div></div>
<div id="tl"></div>
<div class="card"><h2>📦 Batch Run by Basket</h2><div class="row"><select id="bk">${Object.keys(BASKETS).map(b=>`<option>${b}</option>`).join("")}<option>ALL</option></select><button class="btn" id="bgo">Run Batch</button><button class="btn ghost" id="bcx" hidden>⏹ Stop Batch</button></div><div class="sub" id="bprog"></div><div id="bres"></div></div></div>`;
$("#cx").onclick=()=>{PIPE_CANCEL=true;toast("Stopping after current stage…","err");};
$("#bcx").onclick=()=>{PIPE_CANCEL=true;toast("Stopping batch…","err");};
$("#go").onclick=async()=>{const t=$("#tk").value.toUpperCase().trim();$("#tl").innerHTML="";$("#cx").hidden=false;
const res=await runPipeline(t,makeStages("tl","T"));$("#cx").hidden=true;
if(!res){toast("⏹ Pipeline stopped","err");return;}
const a=res.final.final_action,col=a==="BUY"?"buy":a==="SELL"?"sell":"hold";
$("#tl").insertAdjacentHTML("beforeend",`<div class="panel ${col}"><h3 style="font-size:18px">FINAL SIGNAL: ${a} · ${res.final.final_position_pct}% · Approved: ${res.final.approved}</h3><div class="sub">${res.final.notes||""}</div><pre class="memo">${res.memo||""}</pre></div><div id="asg"></div>`);
await showAssignment(t,res,$("#asg"));};
$("#bgo").onclick=async()=>{const name=$("#bk").value;const list=name==="ALL"?uniqueTickers().slice(0,15):Object.keys(BASKETS[name]||{});const rows=[];PIPE_CANCEL=false;$("#bcx").hidden=false;
for(let i=0;i<list.length;i++){if(PIPE_CANCEL)break;$("#bprog").innerHTML=`<span class="loader"></span> [${i+1}/${list.length}] ${list[i]}`;const r=await runPipeline(list[i],()=>{});rows.push({t:list[i],a:r.final.final_action,p:r.final.final_position_pct,w:r.verdict.winner});await sleep(50);}
$("#bcx").hidden=true;$("#bprog").textContent=`DONE · BUY: ${rows.filter(r=>r.a==="BUY").length} | SELL: ${rows.filter(r=>r.a==="SELL").length} | HOLD: ${rows.filter(r=>r.a==="HOLD").length}`;
$("#bres").innerHTML=`<table><tr><th>#</th><th>Ticker</th><th class="c">Signal</th><th class="r">Size %</th><th class="c">Debate</th></tr>`+rows.map((r,i)=>`<tr data-ticker="${r.t}"><td>${i+1}</td><td><b>${r.t}</b></td><td class="c"><span class="sig ${r.a.toLowerCase()}">${r.a}</span></td><td class="r">${r.p}</td><td class="c">${r.w}</td></tr>`).join("")+`</table><br><button class="btn gold" id="bcsv">💾 Export batch CSV</button>`;
$("#bcsv").onclick=()=>downloadCSV("tradingagents_batch.csv",[["ticker","action","position_pct","debate"],...rows.map(r=>[r.t,r.a,r.p,r.w])]);};pills();}

/* ═══ MEMORY / DIAG / SETTINGS v2 ═══ */
function renderMemory(){$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>🧠 Trading Memory — Decision History</h1><div class="sub">${memory.length} recorded decisions · click a row for the dossier</div>
<table><tr><th>#</th><th>Date</th><th>Ticker</th><th class="c">Action</th><th class="r">Size %</th><th>Notes</th></tr>`+memory.slice(-30).reverse().map((r,i)=>`<tr data-ticker="${r.ticker}"><td>${i+1}</td><td>${r.date}</td><td><b>${r.ticker}</b></td><td class="c"><span class="sig ${String(r.action).toLowerCase()}">${r.action}</span></td><td class="r">${r.position_pct}</td><td>${(r.notes||"").slice(0,120)}</td></tr>`).join("")+`</table><br><div class="row"><button class="btn ghost" id="clr">🗑️ Clear memory</button></div></div></div>`;
$("#clr").onclick=()=>{memory.length=0;LS.set("saf_memory",memory);renderMemory();};}
async function renderDiag(){$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>🧪 System Diagnostics</h1><div class="sub" id="dp">running…</div><div id="dt"></div></div></div>`;const R=[];
R.push(["Browser runtime",true,"JS engine operational"]);
let net=false;try{await fetch("https://api.groq.com",{mode:"no-cors",signal:timeoutSignal(6000)});net=true;}catch(e){}
R.push(["Internet connectivity",net,net?"Yahoo/Groq/News/Polymarket reachable":"no connection"]);
let det="synthetic feed active (SIM — instant)";if(net&&state.settings.live){const l=await fetchLive("SPY");det=l?"SPY live $"+l.at(-1).p.toFixed(2):"live fetch failed — SIM fallback";}
R.push(["Market data feed (Yahoo→Stooq)",true,det]);
let nw=[];if(net)nw=await fetchNews("NVDA");
R.push(["News wire (GDELT → rss2json → Yahoo → RSS)",net&&nw.length>0,nw.length?"feed OK · "+nw.length+" headlines":"all news sources unreachable"]);
let pmk=[];if(net)pmk=await fetchPolymarket("fed",3);
R.push(["Polymarket API (Gamma)",net&&pmk.length>0,pmk.length?"markets OK":"Polymarket unreachable"]);
R.push(["GROQ_API_KEY present",AI(),AI()?"set":"NOT set — AI uses SIM"]);
if(AI()){const ad=await autodetectModels();R.push(["Groq model auto-detect",!!ad,ad?("live models: "+ad.live.length+" → deep="+ad.deep+" · fast="+ad.fast):"cannot list models (check key)"]);
const p=await groqPing(state.settings.deep);R.push(["DEEP model ("+state.settings.deep+")",/^OK$/i.test(p),p.slice(0,60)]);
const j=extractJSON(await llm('Return ONLY JSON: {"status":"ok"}',"test",{model:state.settings.fast,temperature:0,json:true}));R.push(["LLM JSON mode",!!j,j?"parses":"JSON parse failed"]);}
else R.push(["AI models",false,"skipped — no key"]);
let w=true;try{localStorage.setItem("t","1");localStorage.removeItem("t");}catch(e){w=false;}
R.push(["localStorage write",w,"baskets/memory/universe persist"]);
R.push(["Basket config",true,Object.keys(BASKETS).length+" baskets, "+uniqueTickers().length+" tickers"]);
R.push(["Candidate universe",true,Object.keys(UNIVERSE).length+" sectors, "+universeTickers().length+" candidates"]);
const passed=R.filter(r=>r[1]).length;
$("#dt").innerHTML=`<table><tr><th>Check</th><th class="c">Status</th><th>Detail</th></tr>`+R.map(r=>`<tr><td>${r[0]}</td><td class="c">${r[1]?'<span class="sig pass">✅ PASS</span>':'<span class="sig fail">❌ FAIL</span>'}</td><td>${r[2]}</td></tr>`).join("")+`</table><div class="panel ${passed===R.length?"buy":"hold"}" style="margin-top:10px"><h3>HEALTH SCORE: ${passed}/${R.length} checks passed</h3></div>`;
$("#dp").textContent="complete";}
function renderSettings(){const s=state.settings;
$("#main").innerHTML=`<div class="wrap"><div class="card"><h1>⚙️ Settings</h1>
<div class="panel"><div class="kv">
<b>GROQ API KEY</b><span><input id="k" type="password" placeholder="gsk_…" style="width:300px" value="${s.key||""}"> <button class="btn" id="show">👁</button></span>
<b>Deep model</b><span><input id="md" value="${s.deep}" style="width:260px"></span>
<b>Fast model</b><span><input id="mf" value="${s.fast}" style="width:260px"></span>
<b>Live market data</b><span><input type="checkbox" id="lv" ${s.live?"checked":""}> Yahoo → Stooq fallback, background refresh</span>
<b>Debate rounds</b><span><select id="rd">${[1,2,3].map(n=>`<option ${((s.rounds||1)===n)?"selected":""}>${n}</option>`).join("")}</select> <span class="dim">1 = fast · 3 = deepest</span></span>
<b>Risk-free rate %</b><span><input id="rf" type="number" step="0.5" value="${s.rf??4}" style="width:80px"> (feeds Sharpe/Sortino)</span>
<b>Target vol contribution %</b><span><input id="tv" type="number" step="5" value="${s.tv??20}" style="width:80px"> (vol-targeted position sizing)</span>
<b>News in pipeline</b><span><input type="checkbox" id="nw" ${s.useNews!==false?"checked":""}></span>
<b>Polymarket in pipeline</b><span><input type="checkbox" id="pm" ${s.usePM!==false?"checked":""}></span>
</div><br>
<button class="btn gold" id="sv">💾 Save</button>
<button class="btn" id="auto">🔎 Auto-detect Groq models</button>
<button class="btn ghost" id="bkup">📦 Backup everything</button>
<button class="btn ghost" id="rstr">♻️ Restore backup</button>
<span class="dim" id="autotxt"></span>
<div class="dim" style="margin-top:6px">Key stored only in this browser. SIM mode is always instant; Live upgrades happen in the background.</div></div></div>
<div class="card"><h2>AI audit log</h2><div class="sub">${aiLog.length} entries</div><details><summary>View</summary><pre class="memo">${JSON.stringify(aiLog.slice(-10),null,1)}</pre></details></div></div>`;
$("#show").onclick=()=>{const e=$("#k");e.type=e.type==="password"?"text":"password";};
$("#bkup").onclick=backupAll;$("#rstr").onclick=restoreAll;
$("#auto").onclick=async()=>{$("#autotxt").innerHTML='<span class="loader"></span> querying Groq…';const r=await autodetectModels();
$("#autotxt").textContent=r?("✅ "+r.live.length+" live models → deep="+r.deep+" · fast="+r.fast):"❌ no key / unreachable";
if(r){$("#md").value=state.settings.deep;$("#mf").value=state.settings.fast;pills();}};
$("#sv").onclick=()=>{state.settings={key:$("#k").value.trim(),live:$("#lv").checked,
deep:$("#md").value.trim()||MODEL_FALLBACKS[0],fast:$("#mf").value.trim()||MODEL_FALLBACKS[1],
rounds:+$("#rd").value,rf:+$("#rf").value||4,tv:+$("#tv").value||20,
useNews:$("#nw").checked,usePM:$("#pm").checked};
liveDashDone=false;LS.set("saf_settings",state.settings);toast("⚙️ Saved");pills();renderSettings();};pills();}
</script>

<script>
/* ═══ BOOT — isolated so a main-script failure still shows a readable card ═══ */
(function(){try{
  const h=(location.hash||"").replace(/^#\//,"");
  pills();
  go(["dash","news","screener","agents","memory","diag","settings"].includes(h)?h:"dash",false);
  console.log("SAF Terminal v4.2 booted OK");
}catch(err){
  const m=document.getElementById("main");
  if(m)m.innerHTML='<div class="card"><h1>⚠️ Startup failed</h1><pre class="memo">'+String(err&&err.stack||err).replace(/</g,"&lt;")+'</pre><div class="sub">Press F12 → Console, screenshot the first red line and report it.</div></div>';
}})();
window.addEventListener("hashchange",function(){try{
  const h=(location.hash||"").replace(/^#\//,"");
  if(state.tab!==h&&document.querySelector('#nav button[data-tab="'+h+'"]'))go(h,false);
}catch(e){}});
</script>
</body>
</html>
